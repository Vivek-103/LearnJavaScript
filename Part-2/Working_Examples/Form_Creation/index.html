<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding element dynamically</title>
    <style>
        html, body {
            height: 100%; /* Needed for centering */
            margin: 0;
            padding: 0;
        }

        #main {
            display: flex;
            align-items: center;
           flex-direction: column;
            width: 100%;
            height: 100%;
        }

        input {
            display: block;
            margin-bottom: 10px;
        }

        .card{
            display: flex;
            flex-wrap: wrap;
            max-width: 350px;
            color: black;
            margin-top: 40px;
            border-radius: 10px;
            padding: 20px;
            border : 2px solid black;
        }
        .profile{
           width: 40px;
           height: 40px;
           background-color: red;
           border-radius: 50%;
           margin-bottom: 10px;
           overflow: hidden;
        }

        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card p{
            font-size: 12px;
            margin-top: 10px;
        }

        .card h5{
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="profile-pic">
            <input type="text" placeholder="name">
            <input type="text" placeholder="occupation">
            <input type="text" placeholder="info">
            <input type="submit">
        </form>
